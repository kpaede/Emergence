name: Release Obsidian plugin

on:
  push:
    tags: ['*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm test
      - run: npm run lint
      - name: Verify version, tag and release assets
        run: npm run release:check
      - name: Publish complete checked release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          assets="dist/$tag"
          if gh release view "$tag" --json isDraft >/tmp/existing-release.json 2>/dev/null; then
            test "$(jq -r .isDraft /tmp/existing-release.json)" = true || { echo "Release already published; refusing to replace it."; exit 1; }
            gh release upload "$tag" "$assets/main.js" "$assets/manifest.json" "$assets/styles.css" "$assets/SHA256SUMS.txt" --clobber
          else
            gh release create "$tag" --verify-tag --draft --title "$tag" --notes-file CHANGELOG.md "$assets/main.js" "$assets/manifest.json" "$assets/styles.css" "$assets/SHA256SUMS.txt"
          fi
          gh release view "$tag" --json assets > /tmp/release-assets.json
          for name in main.js manifest.json styles.css SHA256SUMS.txt; do
            jq -e --arg name "$name" '.assets[] | select(.name == $name)' /tmp/release-assets.json >/dev/null
          done
          mkdir -p /tmp/verified-release-assets
          gh release download "$tag" --dir /tmp/verified-release-assets --pattern main.js --pattern manifest.json --pattern styles.css --pattern SHA256SUMS.txt
          (cd /tmp/verified-release-assets && sha256sum --check SHA256SUMS.txt)
          for name in main.js manifest.json styles.css SHA256SUMS.txt; do
            cmp "$assets/$name" "/tmp/verified-release-assets/$name"
          done
          gh release edit "$tag" --draft=false --latest
